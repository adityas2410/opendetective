[project]
name = "opendetective"
version = "0.1.0"
description = "Open-source investigative AI system"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "OpenDetective contributors" }]
dependencies = []

[project.scripts]
opendetective = "opendetective.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendetective"]

